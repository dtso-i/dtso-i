name: Waka Readme

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Update Readme with Metrics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Update WakaTime README section
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${WAKATIME_API_KEY}" ]; then
            echo "WAKATIME_API_KEY is not set; skipping README update."
            exit 0
          fi

          response="$(curl -fsS "https://wakatime.com/api/v1/users/current/status_bar/today?api_key=${WAKATIME_API_KEY}")"
          total_time="$(python3 -c 'import json,sys; d=json.load(sys.stdin).get("data",{}); print(d.get("grand_total",{}).get("text","0 secs"))' <<<"$response")"
          coding_status="$(python3 -c 'import json,sys; d=json.load(sys.stdin).get("data",{}); c=(d.get("categories") or [{}])[0]; print(c.get("text","No tracked coding yet"))' <<<"$response")"

          python3 - "$total_time" "$coding_status" <<'PY'
          import re
          import sys
          from pathlib import Path

          total_time = sys.argv[1]
          coding_status = sys.argv[2]
          start = "<!--START_SECTION:waka-->"
          end = "<!--END_SECTION:waka-->"

          replacement = (
              f"{start}\n"
              "```text\n"
              f"⌚ Today I coded for {total_time}.\n"
              f"🧠 Primary focus: {coding_status}.\n"
              "```\n"
              f"{end}"
          )

          readme = Path("README.md")
          content = readme.read_text(encoding="utf-8")
          pattern = re.compile(rf"{re.escape(start)}.*?{re.escape(end)}", re.S)
          updated, count = pattern.subn(replacement, content, count=1)
          if count != 1:
              raise SystemExit("README.md does not contain the expected waka section markers.")

          if updated != content:
              readme.write_text(updated, encoding="utf-8")
              print("README.md updated.")
          else:
              print("README.md already up to date.")
          PY

      - name: Commit and push changes
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet README.md; then
            echo "No README changes to commit."
            exit 0
          fi

          git config user.name "dtso-i"
          git config user.email "117575430+dtso-i@users.noreply.github.com"
          git add README.md
          git commit -m "Updated with Dev Metrics"

          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD
